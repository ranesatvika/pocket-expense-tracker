
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline - Pocket Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .offline-card {
            width: 100%;
            max-width: 450px;
            text-align: center;
            padding: 40px 28px;
            border-radius: 24px;
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .offline-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 28px;
        }

        p {
            color: #94a3b8;
            line-height: 1.7;
        }

        button {
            margin-top: 20px;
            padding: 13px 22px;
            border: none;
            border-radius: 12px;
            background: #10b981;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #34d399;
        }
    </style>
</head>

<body>
    <div class="offline-card">
        <div class="offline-icon">📶</div>

        <h1>You're offline</h1>

        <p>
            Pocket Expense Tracker couldn't connect right now.
            Check your internet connection and try again.
        </p>

        <button onclick="window.location.reload()">
            Try Again
        </button>
    </div>
</body>
</html>
