<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18765d">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/pocket.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/pocket-192.png') }}">
  <title>Sign in — Pocket</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="{{ url_for('login') }}"><span class="brand-mark">p</span> pocket</a>
    <p class="eyebrow">YOUR MONEY, MADE SIMPLE</p>
    <h1>Welcome back.</h1>
    <p class="login-copy">Enter your password to open your expense tracker.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="messages">{% for kind, message in messages %}<p class="notice {{ kind }}">{{ message }}</p>{% endfor %}</div>{% endif %}{% endwith %}
    <form method="post" class="expense-form">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="primary-button" type="submit">Sign in <span>→</span></button>
    </form>
  </main>
</body>
</html>
